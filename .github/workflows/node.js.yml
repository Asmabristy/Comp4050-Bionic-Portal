name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2.
      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'         

      # 3.
      - name: Install dependencies
        run: npm install
        working-directory: ./web

      # 4. 
      - name: Compile frontend
        run: npm run build
        working-directory: ./web