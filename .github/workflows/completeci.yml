name: Complete CI (Frontend + Backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install
        working-directory: ./web

      - name: Compile frontend
        run: npm run build
        working-directory: ./web

  frontend-test:
    needs: frontend-build
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Node.js ${{ matrix.node-version }} setup
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install
      working-directory: ./web

    - name: Run frontend tests
      run: npx vitest run --config ../testing/vitest.frontend.config.mjs
      working-directory: ./web

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./server

      - name: Run backend tests
        run: npx vitest run --config ../testing/vitest.backend.config.mjs
        working-directory: ./server